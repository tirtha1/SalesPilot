services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salespilot
      POSTGRES_USER: salespilot
      POSTGRES_PASSWORD: salespilot
    ports:
      - "5432:5432"
    volumes:
      - salespilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salespilot -d salespilot"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  salespilot_postgres:

